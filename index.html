<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>単位変換</title>
<meta name="description" content="アメリカ生活で出会う単位（ft、lb、°F、cup、mph、mpg、psi など）をすばやく変換するアプリ">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="単位変換">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card-press:#E5E5EA; --fill:rgba(118,118,128,.12);
  --label:#000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.29);
  --tint:#5856D6; --tint-soft:rgba(88,86,214,.12);
  --kb:#D1D3D9; --key:#FFFFFF; --key-fn:#ACB1BA; --key-shadow:#898A8D; --key-press:#B8BBC2;
  --seg-on:#FFFFFF; --sheet-bg:#F2F2F7; --sheet-card:#FFFFFF; --toast:rgba(28,28,30,.88);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --card:#1C1C1E; --card-press:#2C2C2E; --fill:rgba(118,118,128,.24);
    --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
    --tint:#7D7AFF; --tint-soft:rgba(125,122,255,.18);
    --kb:#1B1B1D; --key:#4B4B4F; --key-fn:#2E2E31; --key-shadow:#000; --key-press:#6C6C71;
    --seg-on:#636366; --sheet-bg:#1C1C1E; --sheet-card:#2C2C2E; --toast:rgba(72,72,74,.95);
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  color:var(--label);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus{outline:none}
button:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
svg{display:block}
#app{position:fixed;inset:0;max-width:540px;margin:0 auto;overflow:hidden;background:var(--bg)}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);
  transition:transform .42s cubic-bezier(.2,.85,.25,1),filter .42s;will-change:transform}
#home.behind{transform:translateX(-28%);filter:brightness(.92)}
#detail{transform:translateX(102%);box-shadow:-2px 0 16px rgba(0,0,0,.12)}
#detail.open{transform:none}
.no-anim .view,.no-anim .sheet,.no-anim .sheet-back{transition:none!important}
@media (prefers-reduced-motion: reduce){.view,.sheet,.sheet-back,.toast{transition:none!important}}

/* ---------- Home ---------- */
.home-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(var(--safe-t) + 6px) 16px calc(var(--safe-b) + 28px)}
.home-bar{display:flex;justify-content:flex-end;align-items:center;height:44px}
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px}
.seg button{border:0;background:none;font-size:13px;font-weight:500;padding:5px 11px;border-radius:7px;line-height:1.2}
.seg button.on{background:var(--seg-on);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
h1{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.2px;margin:0 0 10px}
.search{display:flex;align-items:center;gap:6px;height:36px;padding:0 8px;border-radius:10px;background:var(--fill)}
.search svg{width:16px;height:16px;flex:none;stroke:var(--label2);fill:none;stroke-width:2.2;stroke-linecap:round}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font:inherit;font-size:17px;color:var(--label);-webkit-user-select:text;user-select:text}
.search input::placeholder{color:var(--label2)}
.search .clear{border:0;background:var(--label3);color:var(--bg);width:18px;height:18px;border-radius:50%;padding:0;display:none;place-items:center;flex:none}
.search .clear svg{width:8px;height:8px;stroke:var(--card);stroke-width:3}
.search.has .clear{display:grid}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.cat{border:0;background:var(--card);border-radius:14px;padding:12px 12px 11px;text-align:left;
  display:flex;flex-direction:column;min-height:98px;transition:background .15s}
.cat:active{background:var(--card-press)}
.cat .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.ic svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cat .nm{font-size:17px;font-weight:600;margin-top:auto;padding-top:12px;letter-spacing:-.2px}
.cat .ex{font-size:13px;color:var(--label2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty-msg{color:var(--label2);text-align:center;font-size:15px;padding:40px 12px}
.foot{font-size:13px;color:var(--label2);text-align:center;margin-top:22px;line-height:1.5}

/* ---------- Detail ---------- */
.nav{flex:none;position:relative;height:calc(44px + var(--safe-t));padding-top:var(--safe-t);display:flex;align-items:center}
.back{border:0;background:none;color:var(--tint);font-size:17px;height:44px;padding:0 10px 0 8px;display:flex;align-items:center;gap:5px;max-width:42%}
.back span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back svg{width:12px;height:21px;flex:none;stroke:var(--tint);fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.nav-title{position:absolute;left:50%;bottom:0;transform:translateX(-50%);line-height:44px;font-size:17px;font-weight:600;white-space:nowrap}
.top{flex:none;padding:2px 16px 0}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar,.presets::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:16px;height:32px;padding:0 14px;background:var(--fill);font-size:15px}
.chip.on{background:var(--tint);color:#fff;font-weight:600}
.conv{background:var(--card);border-radius:16px}
.conv .row{padding:9px 16px 10px}
.unit-btn{border:0;background:none;padding:3px 0;display:inline-flex;align-items:center;gap:6px;color:var(--tint);font-size:15px;font-weight:600;max-width:100%}
.unit-btn .s{color:var(--label2);font-weight:400}
.unit-btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit-btn svg{width:9px;height:14px;flex:none;stroke:var(--tint);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{display:block;width:100%;border:0;background:none;padding:0;text-align:right;font-size:42px;line-height:50px;height:50px;font-weight:300;
  letter-spacing:-.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num.s1{font-size:34px}.num.s2{font-size:28px}.num.s3{font-size:23px}
.num.empty{color:var(--label3)}
#inVal::after{content:"";display:inline-block;width:2px;height:.9em;margin-left:2px;vertical-align:-.08em;background:var(--tint);animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){#inVal::after{animation:none}}
#outVal{color:var(--tint);font-weight:400}
#outVal.flash{animation:flash .5s ease-out}
@keyframes flash{from{opacity:.25}to{opacity:1}}
.sub{text-align:right;font-size:15px;line-height:20px;height:20px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.mid{position:relative;height:.5px;background:var(--sep);margin-left:16px}
.swap{position:absolute;left:50%;top:0;transform:translate(calc(-50% - 8px),-50%);width:38px;height:38px;border-radius:50%;
  border:.5px solid var(--sep);background:var(--card);display:grid;place-items:center;padding:0;z-index:1}
.swap:active{background:var(--card-press)}
.swap svg{width:19px;height:19px;stroke:var(--tint);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 22px}
.sh{font-size:13px;color:var(--label2);padding:0 16px 7px}
.presets{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 22px;padding:0 16px;scrollbar-width:none}
.pchip{flex:none;border:0;background:var(--card);border-radius:12px;padding:8px 12px 9px;text-align:left;transition:background .15s}
.pchip:active{background:var(--card-press)}
.pchip .l{display:block;font-size:12px;color:var(--label2)}
.pchip .v{display:block;font-size:15px;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.list{background:var(--card);border-radius:12px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 16px;border:0;background:none;text-align:left;position:relative}
.li+.li::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.li:active{background:var(--card-press)}
.li .nm{flex:1;min-width:0;font-size:17px;padding:11px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .nm i{font-style:normal;color:var(--label2);font-size:15px;margin-left:6px}
.li .vv{flex:none;max-width:58%;font-size:17px;color:var(--label2);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li.on .vv{color:var(--tint);font-weight:600}
.note{font-size:13px;line-height:1.45;color:var(--label2);padding:8px 16px 0}

.kb{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:7px 6px;background:var(--kb);padding:7px 4px calc(var(--safe-b) + 7px)}
.key{height:47px;border:0;border-radius:8px;background:var(--key);box-shadow:0 1px 0 var(--key-shadow);font-size:25px;font-weight:400;
  display:grid;place-items:center;padding:0;font-variant-numeric:tabular-nums}
.key.fn{background:var(--key-fn);font-size:17px}
.key:active,.key.down{background:var(--key-press)}
.key.fn:active,.key.fn.down{background:var(--key)}
.key svg{width:26px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Sheet ---------- */
.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.36);opacity:0;pointer-events:none;transition:opacity .28s;z-index:10}
.sheet-back.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:540px;margin:0 auto;max-height:80%;background:var(--sheet-bg);
  border-radius:14px 14px 0 0;transform:translateY(105%);transition:transform .36s cubic-bezier(.2,.85,.25,1);
  display:flex;flex-direction:column;z-index:11;padding-bottom:var(--safe-b)}
.sheet.open{transform:none}
.sheet-head{flex:none;position:relative;height:56px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600}
.sheet-head button{position:absolute;right:8px;top:6px;height:44px;padding:0 10px;border:0;background:none;color:var(--tint);font-size:17px;font-weight:600}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 20px}
.sheet .list{background:var(--sheet-card)}
.sheet .li .ck{width:20px;height:20px;flex:none;stroke:var(--tint);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;visibility:hidden}
.sheet .li.on .ck{visibility:visible}

.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 56px);transform:translate(-50%,-8px);background:var(--toast);color:#fff;
  font-size:15px;font-weight:500;padding:9px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-height:640px){
  .num{font-size:34px;line-height:42px;height:42px}.num.s1{font-size:28px}.num.s2{font-size:24px}.num.s3{font-size:20px}
  .key{height:42px}.conv .row{padding:6px 16px 7px}.scroll{padding-top:14px}
}
</style>
</head>
<body>
<div id="app">
  <section class="view" id="home" aria-label="categories">
    <div class="home-scroll">
      <div class="home-bar">
        <div class="seg" role="group" aria-label="Language">
          <button data-lang="ja" type="button">日本語</button><button data-lang="en" type="button">EN</button>
        </div>
      </div>
      <h1 id="homeTitle"></h1>
      <label class="search" id="searchBox">
        <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></svg>
        <input id="q" type="search" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
        <button class="clear" id="qClear" type="button" aria-label="clear"><svg viewBox="0 0 10 10"><path d="M2 2l6 6M8 2l-6 6"/></svg></button>
      </label>
      <div class="grid" id="grid"></div>
      <p class="foot" id="foot"></p>
    </div>
  </section>

  <section class="view" id="detail" aria-hidden="true">
    <div class="nav">
      <button class="back" id="back" type="button"><svg viewBox="0 0 12 21"><path d="M10 2L2 10.5 10 19"/></svg><span id="backLbl"></span></button>
      <div class="nav-title" id="navTitle"></div>
    </div>
    <div class="top">
      <div class="chips" id="ing"></div>
      <div class="conv">
        <div class="row">
          <button class="unit-btn" id="fromBtn" type="button"></button>
          <div class="num" id="inVal" aria-live="polite"></div>
          <div class="sub" id="inHint"></div>
        </div>
        <div class="mid"><button class="swap" id="swap" type="button"><svg viewBox="0 0 24 24"><path d="M8 20V4M8 4L4.5 7.5M8 4l3.5 3.5M16 4v16M16 20l-3.5-3.5M16 20l3.5-3.5"/></svg></button></div>
        <div class="row">
          <button class="unit-btn" id="toBtn" type="button"></button>
          <button class="num" id="outVal" type="button"></button>
          <div class="sub" id="outSub"></div>
        </div>
      </div>
    </div>
    <div class="scroll" id="scroll">
      <div class="sh" id="presetHead"></div>
      <div class="presets" id="presets"></div>
      <div class="sh" id="allHead"></div>
      <div class="list" id="all"></div>
      <p class="note" id="note"></p>
    </div>
    <div class="kb" id="kb"></div>
  </section>
</div>

<div class="sheet-back" id="sheetBack"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-head"><span id="sheetTitle"></span><button id="sheetDone" type="button"></button></div>
  <div class="sheet-body"><div class="list" id="sheetList"></div></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';

/* ================= Text ================= */
const STR = {
  ja: {
    title: '単位変換', search: '単位を検索（例: psi、カップ）', noMatch: q => `「${q}」に一致する単位はありません`,
    foot: '計算はすべて端末内で行われ、オフラインでも使えます。',
    presets: 'よく使う換算', all: 'すべての単位', from: '変換元の単位', to: '変換先の単位', done: '完了',
    copied: 'コピーしました', space: '空白', clear: 'AC', swap: '単位を入れ替え', del: '1文字削除',
    ftinHint: '「5 10」と入力 → 5′10″', ing: '材料', back: '単位変換'
  },
  en: {
    title: 'Units', search: 'Search units (e.g. psi, cup)', noMatch: q => `No units match “${q}”`,
    foot: 'Everything is calculated on your device and works offline.',
    presets: 'Common conversions', all: 'All units', from: 'Convert from', to: 'Convert to', done: 'Done',
    copied: 'Copied', space: 'space', clear: 'AC', swap: 'Swap units', del: 'Delete',
    ftinHint: 'Type “5 10” for 5′10″', ing: 'Ingredient', back: 'Units'
  }
};

/* ================= Icons ================= */
const IC = {
  length: '<rect x="2" y="8.5" width="20" height="7" rx="1.5"/><path d="M6 8.5V11M10 8.5v3.5M14 8.5V11M18 8.5v3.5"/>',
  weight: '<circle cx="12" cy="6" r="2.6"/><path d="M6.2 9.5h11.6L20 20H4z"/>',
  volume: '<path d="M5 4h11v13a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z"/><path d="M16 8h1.5a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2H16"/><path d="M5 9h4M5 13h3"/>',
  temp: '<path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/><path d="M12 9v7"/>',
  area: '<path d="M4 4h16v16H4z"/><path d="M4 13h7v7M13 4v5h7"/>',
  speed: '<path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 15.5l4.5-5"/>',
  fuel: '<path d="M4 20V5.5A1.5 1.5 0 0 1 5.5 4h6A1.5 1.5 0 0 1 13 5.5V20M3 20h11M4 10h9"/><path d="M13 8.5h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V8.5L17.5 6"/>',
  pressure: '<circle cx="12" cy="12" r="8.5"/><path d="M12 12l3.5-4"/><path d="M7.5 16h9"/>',
  energy: '<path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/>',
  power: '<path d="M12 3.5v8"/><path d="M7 6.5a7.5 7.5 0 1 0 10 0"/>',
  cooking: '<path d="M3.5 11.5h17a8.5 8.5 0 0 1-17 0z"/><path d="M14.5 11.5L19 4"/>',
  shoe: '<path d="M3 6.5l4.2 1.6 2.4 2.6 4.4 1.6 4.3 1a3 3 0 0 1 2.7 3V18H3z"/><path d="M3 18v2h18v-2"/>'
};
const SVG = {
  chev: '<svg viewBox="0 0 9 14"><path d="M1.5 5L4.5 2l3 3M1.5 9l3 3 3-3"/></svg>',
  check: '<svg class="ck" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>',
  del: '<svg viewBox="0 0 28 20"><path d="M9 2h15a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H9l-7-8z"/><path d="M13.5 7l6 6M19.5 7l-6 6"/></svg>'
};

/* ================= Data ================= */
const F2C = { to: x => (x - 32) * 5 / 9, from: b => b * 9 / 5 + 32 };
const K2C = { to: x => x - 273.15, from: b => b + 273.15 };
const MPG_K = 100 * 3.785411784 / 1.609344;   // 235.2146
const BTU = 1055.05585262;

const ING = [
  { id: 'flour',  d: 0.528, ja: '小麦粉',     en: 'Flour',          kw: '薄力粉 中力粉 all-purpose' },
  { id: 'sugar',  d: 0.845, ja: '砂糖',       en: 'Sugar',          kw: 'グラニュー糖 granulated' },
  { id: 'brown',  d: 0.90,  ja: 'ブラウンシュガー', en: 'Brown sugar', kw: '黒糖 packed' },
  { id: 'powder', d: 0.50,  ja: '粉砂糖',     en: 'Powdered sugar', kw: 'confectioners icing' },
  { id: 'butter', d: 0.959, ja: 'バター',     en: 'Butter',         kw: 'stick' },
  { id: 'water',  d: 1.0,   ja: '水',         en: 'Water',          kw: '' },
  { id: 'milk',   d: 1.03,  ja: '牛乳',       en: 'Milk',           kw: '' },
  { id: 'oil',    d: 0.92,  ja: '油',         en: 'Oil',            kw: 'サラダ油 vegetable' },
  { id: 'honey',  d: 1.42,  ja: 'はちみつ',   en: 'Honey',          kw: '' },
  { id: 'salt',   d: 1.2,   ja: '塩',         en: 'Salt',           kw: 'table' },
  { id: 'rice',   d: 0.83,  ja: '米（生）',   en: 'Rice (raw)',     kw: 'お米 合' },
  { id: 'oats',   d: 0.38,  ja: 'オートミール', en: 'Rolled oats',  kw: 'oatmeal' }
];

const CATS = [
  { id: 'length', color: '#007AFF', ja: '長さ', en: 'Length', ex: 'in, ft, mi ↔ cm, km',
    def: ['ftin', 'cm', '5 10'],
    units: [
      { id: 'mm', f: 0.001, sym: 'mm', ja: 'ミリメートル', en: 'Millimeters' },
      { id: 'cm', f: 0.01, sym: 'cm', ja: 'センチメートル', en: 'Centimeters' },
      { id: 'm', f: 1, sym: 'm', ja: 'メートル', en: 'Meters' },
      { id: 'km', f: 1000, sym: 'km', ja: 'キロメートル', en: 'Kilometers' },

  if (!nums.length || nums.some(n => !isFinite(n))) return NaN;
  const v = u && u.compound === 'ftin'
    ? nums[0] + nums.slice(1).reduce((a, b) => a + b, 0) / 12
    : nums.reduce((a, b) => a + b, 0);
  return neg ? -v : v;
}

/* ================= Formatting ================= */
const NF = {};
function nf(x, o) {
  const k = lang + JSON.stringify(o);
  return (NF[k] = NF[k] || new Intl.NumberFormat(lang === 'ja' ? 'ja-JP' : 'en-US', o)).format(x);
}
const SUP = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
function fmt(x, cat, sig = 6) {
  if (!isFinite(x)) return '—';
  if (Math.abs(x) < 1e-12) return '0';
  const ax = Math.abs(x);
  if (ax >= 1e12 || ax < 1e-5) {
    let e = Math.floor(Math.log10(ax)), m = +(x / Math.pow(10, e)).toPrecision(4);
    if (Math.abs(m) >= 10) { m /= 10; e++; }
    return nf(m, { maximumSignificantDigits: 4 }) + '×10' + String(e).replace(/./g, c => SUP[c]);
  }
  if (cat && cat.fd != null) return nf(x, { maximumFractionDigits: cat.fd });
  if (ax >= Math.pow(10, sig)) return nf(x, { maximumFractionDigits: 0 });
  return nf(x, { maximumSignificantDigits: sig });
}
function ftin(ftVal) {
  if (!isFinite(ftVal)) return '—';
  const neg = ftVal < 0, total = Math.abs(ftVal) * 12;
  let f = Math.floor(total / 12), i = Math.round((total - f * 12) * 10) / 10;
  if (i >= 12) { f += 1; i = 0; }
  return (neg ? '−' : '') + `${f}′ ${nf(i, { maximumFractionDigits: 1 })}″`;
}
function fmtU(cat, u, x, sig) {
  return u.compound === 'ftin' ? ftin(x) : fmt(x, cat, sig);
}
const VULG = { '1/2': '½', '1/3': '⅓', '2/3': '⅔', '1/4': '¼', '3/4': '¾', '1/8': '⅛', '3/8': '⅜', '5/8': '⅝', '7/8': '⅞' };
const gcd = (a, b) => b ? gcd(b, a % b) : a;
function frac(x, maxDen) {
  if (!(x > 0) || x >= 1000) return null;
  const dens = maxDen === 16 ? [2, 4, 8, 16] : maxDen === 4 ? [2, 4] : [2, 3, 4, 8];
  let best = null;
  for (const d of dens) {
    const n = Math.round(x * d), err = Math.abs(x - n / d);
    if (!best || err < best.err - 1e-12) best = { n, d, err };
  }
  if (best.err / x > 0.03) return null;
  let { n, d } = best;
  const w = Math.floor(n / d); n -= w * d;
  if (n === 0) return null;
  const g = gcd(n, d); n /= g; d /= g;
  const fs = VULG[n + '/' + d] || (n + '/' + d);
  return (best.err < 1e-6 * x ? '= ' : '≈ ') + (w ? w + ' ' : '') + fs;
}
function subFor(cat, u, v) {
  if (!isFinite(v)) return '';
  if (u.extra === 'ftin') return '= ' + ftin(v);
  if (u.extra === 'lboz' && Math.abs(v) < 1e5) {
    const neg = v < 0, a = Math.abs(v);
    let lb = Math.floor(a), oz = Math.round((a - lb) * 160) / 10;
    if (oz >= 16) { lb++; oz = 0; }
    return `= ${neg ? '−' : ''}${nf(lb, {})} lb ${nf(oz, { maximumFractionDigits: 1 })} oz`;
  }
  if (u.compound === 'ftin') return '= ' + fmt(v * 12, cat, 4) + ' in';
  if (u.frac) { const f = frac(v, u.frac); if (f) return f + ' ' + symOf(u); }
  return '';
}

/* ================= Home ================= */
function renderHome() {
  document.documentElement.lang = lang;
  document.title = t().title;
  $('homeTitle').textContent = t().title;
  $('q').placeholder = t().search;
  $('foot').textContent = t().foot;
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  const q = $('q').value.trim().toLowerCase();
  $('searchBox').classList.toggle('has', !!q);
  let html = '';
  for (const cat of CATS) {
    const m = match(cat, q);
    if (!m.ok) continue;
    const ex = q && m.units.length ? m.units.map(u => symOf(u)).join(', ') : cat.ex;
    html += `<button class="cat" type="button" data-cat="${cat.id}" data-unit="${m.units[0] ? m.units[0].id : ''}">
      <span class="ic" style="background:${cat.color}"><svg viewBox="0 0 24 24">${IC[cat.id]}</svg></span>
      <span class="nm">${esc(cat[lang])}</span><span class="ex">${esc(ex)}</span></button>`;
  }
  $('grid').innerHTML = html || `<p class="empty-msg" style="grid-column:1/-1">${esc(t().noMatch($('q').value.trim()))}</p>`;
}
function match(cat, q) {
  if (!q) return { ok: true, units: [] };
  const units = cat.units.filter(u => [u.id, u.ja, u.en, symOf(u, 'ja'), symOf(u, 'en')].join(' ').toLowerCase().includes(q));
  let hay = [cat.ja, cat.en, cat.ex].join(' ').toLowerCase();
  if (cat.ing) hay += ' ' + ING.map(i => [i.ja, i.en, i.kw].join(' ')).join(' ').toLowerCase();
  return { ok: hay.includes(q) || units.length > 0, units: hay.includes(q) ? [] : units };
}

/* ================= Detail ================= */
function renderDetail() {
  if (!cur) return;
  const cat = CAT[cur], st = stateOf(cat);
  $('navTitle').textContent = cat[lang];
  $('backLbl').textContent = t().back;
  $('swap').setAttribute('aria-label', t().swap);
  // ingredients
  const ing = $('ing');
  ing.hidden = !cat.ing;
  if (cat.ing) {
    ing.innerHTML = ING.map(i => `<button type="button" class="chip${i.id === st.ing ? ' on' : ''}" data-ing="${i.id}">${esc(i[lang])}</button>`).join('');
  }
  const fu = U(cat, st.from), tu = U(cat, st.to);
  $('fromBtn').innerHTML = `<span>${esc(fu[lang])}</span> <span class="s">${esc(symOf(fu))}</span>${SVG.chev}`;
  $('toBtn').innerHTML = `<span>${esc(tu[lang])}</span> <span class="s">${esc(symOf(tu))}</span>${SVG.chev}`;
  // presets
  $('presetHead').textContent = t().presets;
  $('presets').innerHTML = cat.presets.map((p, i) => {
    const tmp = { from: p.from, to: p.to, input: p.v, ing: p.ing || st.ing };
    const pf = U(cat, p.from), pt = U(cat, p.to);
    const v = convert(cat, tmp, p.to);
    const left = pf.compound === 'ftin' ? ftin(parse(p.v, pf)) : `${fmt(parse(p.v, pf), cat)} ${symOf(pf)}`;
    const right = pt.compound === 'ftin' ? ftin(v) : `${fmt(v, cat, 4)} ${symOf(pt)}`;
    return `<button type="button" class="pchip" data-p="${i}"><span class="l">${esc(p[lang])}</span><span class="v">${esc(left)} = ${esc(right)}</span></button>`;
  }).join('');
  $('allHead').textContent = t().all;
  $('note').textContent = cat.note ? cat.note[lang] : '';
  renderKeys();
  update();
}

function inputText(st, u) {
  const s = st.input;
  if (!s) return null;
  const group = tok => tok.replace(/^(\d{4,})/, m => nf(+m, { maximumFractionDigits: 0 }));
  let neg = s[0] === '-', body = neg ? s.slice(1) : s;
  const toks = body.split(' ');
  let out;
  if (u.compound === 'ftin') out = group(toks[0]) + '′' + (toks.length > 1 ? ' ' + toks[1] + (toks[1] ? '″' : '') : '');
  else out = toks.map(tk => tk.includes('/') ? tk : group(tk)).join(' ');
  return (neg ? '−' : '') + out;
}
function sizeClass(el, txt) {
  const n = txt.length;
  el.classList.remove('s1', 's2', 's3');
  if (n > 15) el.classList.add('s3'); else if (n > 12) el.classList.add('s2'); else if (n > 9) el.classList.add('s1');
}

function update() {
  const cat = CAT[cur], st = stateOf(cat);
  const fu = U(cat, st.from), tu = U(cat, st.to);
  const inEl = $('inVal'), txt = inputText(st, fu);
  inEl.textContent = txt == null ? '0' : txt;
  inEl.classList.toggle('empty', txt == null);
  sizeClass(inEl, inEl.textContent);
  const x = parse(st.input, fu);
  let hint = '';
  if (fu.compound === 'ftin') hint = st.input ? (isFinite(x) ? '= ' + fmt(x * 12, cat, 5) + ' in' : '') : t().ftinHint;
  else if (/[\/ ]/.test(st.input.trim()) && isFinite(x)) hint = '= ' + fmt(x, cat);
  $('inHint').textContent = hint;

  const v = convert(cat, st, st.to);
  const outEl = $('outVal');
  const vt = st.input ? fmtU(cat, tu, v) : '0';
  outEl.textContent = vt;
  outEl.classList.toggle('empty', !st.input);
  sizeClass(outEl, vt);
  outEl.setAttribute('aria-label', `${vt} ${symOf(tu)}`);
  $('outSub').textContent = st.input ? subFor(cat, tu, v) : '';

  // all units list
  $('all').innerHTML = unitsOf(cat, st).filter(u => u.id !== st.from).map(u => {
    const val = st.input ? fmtU(cat, u, convert(cat, st, u.id)) : '—';
    return `<button type="button" class="li${u.id === st.to ? ' on' : ''}" data-u="${u.id}">
      <span class="nm">${esc(u[lang])}<i>${esc(symOf(u))}</i></span><span class="vv">${esc(val)}</span></button>`;
  }).join('');
  save();
}

/* ================= Keypad ================= */
const KEYS = [['7'], ['8'], ['9'], ['del', 'fn'], ['4'], ['5'], ['6'], ['/', 'fn'], ['1'], ['2'], ['3'], ['±', 'fn'], ['AC', 'fn'], ['0'], ['.'], ['sp', 'fn']];
function renderKeys() {
  $('kb').innerHTML = KEYS.map(([k, c]) => {
    const label = k === 'del' ? SVG.del : k === 'sp' ? esc(t().space) : k === 'AC' ? t().clear : k === '/' ? '⁄' : k === '±' ? '+/−' : k;
    const aria = k === 'del' ? t().del : k === 'sp' ? t().space : k;
    return `<button type="button" class="key${c ? ' ' + c : ''}" data-k="${k}" aria-label="${esc(aria)}">${label}</button>`;
  }).join('');
}
function press(k) {
  if (!cur) return;
  const cat = CAT[cur], st = stateOf(cat), u = U(cat, st.from);
  let s = st.input;
  const neg = s.startsWith('-');
  let body = neg ? s.slice(1) : s;
  const toks = body.split(' ');
  const last = toks[toks.length - 1];
  if (/^\d$/.test(k)) {
    if (body.replace(/\D/g, '').length >= 15) return;
    if (last === '0') body = body.slice(0, -1) + k; else body += k;
  } else if (k === '.') {
    if (last.includes('.') || last.includes('/')) return;
    body += last === '' ? '0.' : '.';
  } else if (k === '/') {
    if (!/\d$/.test(last) || last.includes('/') || last.includes('.')) return;
    body += '/';
  } else if (k === 'sp') {
    if (!/\d$/.test(last) || toks.length >= 2 || last.includes('/')) return;
    body += ' ';
  } else if (k === '±') {
    st.input = neg ? body : '-' + body; update(); return;
  } else if (k === 'del') {
    if (!body && neg) { st.input = ''; update(); return; }
    body = body.slice(0, -1);
  } else if (k === 'AC') {
    st.input = ''; update(); return;
  }
  st.input = (neg ? '-' : '') + body;
  update();
}

/* ================= Actions ================= */
function toInputString(x, u) {
  if (!isFinite(x)) return null;
  if (u.compound === 'ftin') {
    const neg = x < 0, total = Math.abs(x) * 12;
    let f = Math.floor(total / 12), i = Math.round((total - f * 12) * 10) / 10;
    if (i >= 12) { f++; i = 0; }
    return (neg ? '-' : '') + f + (i ? ' ' + i : '');
  }
  const s = String(+x.toPrecision(6));
  return /e/i.test(s) ? null : s;
}
function setFrom(cat, st, id) {
  const oldU = U(cat, st.from), newU = U(cat, id);
  if (id === st.to) st.to = st.from;
  if ((oldU.compound || newU.compound) && st.input) {
    const s = toInputString(fromBase(cat, newU, toBase(cat, oldU, parse(st.input, oldU), st), st), newU);
    if (s != null) st.input = s;
  }
  st.from = id;
}
function swap() {
  const cat = CAT[cur], st = stateOf(cat);
  const v = convert(cat, st, st.to);
  const s = st.input ? toInputString(v, U(cat, st.to)) : null;
  [st.from, st.to] = [st.to, st.from];
  if (s != null) st.input = s;
  renderDetail();
  flash();
}
function flash() {
  const el = $('outVal'); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
let toastT;
function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1300);
}
function copyResult() {
  const cat = CAT[cur], st = stateOf(cat);
  if (!st.input) return;
  const tu = U(cat, st.to), v = convert(cat, st, st.to);
  if (!isFinite(v)) return;
  const txt = tu.compound === 'ftin' ? ftin(v) : `${fmt(v, cat)} ${symOf(tu)}`;
  const done = () => toast(t().copied);
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => {});
}

/* ================= Sheet ================= */
function openSheet(which) {
  const cat = CAT[cur], st = stateOf(cat);
  sheetFor = which;
  $('sheetTitle').textContent = which === 'from' ? t().from : t().to;
  $('sheetDone').textContent = t().done;
  const sel = which === 'from' ? st.from : st.to;
  $('sheetList').innerHTML = unitsOf(cat, st).map(u =>
    `<button type="button" class="li${u.id === sel ? ' on' : ''}" data-u="${u.id}"><span class="nm">${esc(u[lang])}<i>${esc(symOf(u))}</i></span>${SVG.check}</button>`
  ).join('');
  $('sheet').classList.add('open'); $('sheetBack').classList.add('open');
  const on = $('sheetList').querySelector('.on');
  if (on) setTimeout(() => on.scrollIntoView({ block: 'center' }), 0);
}
function closeSheet() {
  sheetFor = null;
  $('sheet').classList.remove('open'); $('sheetBack').classList.remove('open');
}

/* ================= Navigation ================= */
function openCat(id, opts = {}) {
  if (!CAT[id]) return;
  cur = id; S.view = id;
  $('scroll').scrollTop = 0;
  renderDetail();
  $('detail').classList.add('open'); $('detail').setAttribute('aria-hidden', 'false');
  $('home').classList.add('behind'); $('home').setAttribute('aria-hidden', 'true');
  if (!opts.noPush) history.pushState({ cat: id }, '');
  save();
}
function closeCat() {
  closeSheet();
  $('detail').classList.remove('open'); $('detail').setAttribute('aria-hidden', 'true');
  $('home').classList.remove('behind'); $('home').setAttribute('aria-hidden', 'false');
  cur = null; S.view = null; save();
}
function goBack() {
  if (history.state && history.state.cat) history.back(); else closeCat();
}
window.addEventListener('popstate', e => {
  const s = e.state || {};
  if (s.cat && !cur) openCat(s.cat, { noPush: true });
  else if (!s.cat && cur) closeCat();
});

/* ================= Events ================= */
document.addEventListener('touchstart', () => {}, { passive: true }); // enables :active on iOS
$('grid').addEventListener('click', e => {
  const b = e.target.closest('.cat'); if (!b) return;
  const cat = CAT[b.dataset.cat], st = stateOf(cat);
  if (b.dataset.unit && $('q').value.trim()) setFrom(cat, st, b.dataset.unit);
  openCat(cat.id);
});
$('q').addEventListener('input', renderHome);
$('qClear').addEventListener('click', e => { e.preventDefault(); $('q').value = ''; renderHome(); $('q').focus(); });
document.querySelector('.seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  lang = b.dataset.lang; save(); renderHome(); if (cur) renderDetail();
});
$('back').addEventListener('click', goBack);
$('swap').addEventListener('click', swap);
$('fromBtn').addEventListener('click', () => openSheet('from'));
$('toBtn').addEventListener('click', () => openSheet('to'));
$('outVal').addEventListener('click', copyResult);
$('ing').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const cat = CAT[cur], st = stateOf(cat);
  st.ing = b.dataset.ing;
  stateOf(cat);
  renderDetail();
  b.blur();
  const on = $('ing').querySelector('.on'); if (on) on.scrollIntoView({ inline: 'nearest', block: 'nearest' });
});
$('presets').addEventListener('click', e => {
  const b = e.target.closest('.pchip'); if (!b) return;
  const cat = CAT[cur], st = stateOf(cat), p = cat.presets[+b.dataset.p];
  if (p.ing) st.ing = p.ing;
  st.from = p.from; st.to = p.to; st.input = p.v;
  renderDetail(); flash();
});
$('all').addEventListener('click', e => {
  const b = e.target.closest('.li'); if (!b) return;
  stateOf(CAT[cur]).to = b.dataset.u; update(); renderDetail(); flash();
});
$('sheetList').addEventListener('click', e => {
  const b = e.target.closest('.li'); if (!b || !sheetFor) return;
  const cat = CAT[cur], st = stateOf(cat), id = b.dataset.u;
  if (sheetFor === 'from') setFrom(cat, st, id);
  else { if (id === st.from) st.from = st.to; st.to = id; }
  closeSheet(); renderDetail(); flash();
});
$('sheetDone').addEventListener('click', closeSheet);
$('sheetBack').addEventListener('click', closeSheet);

// keypad: press on pointerdown for snappy feel, auto-repeat for delete
let repT, repI;
const stopRep = () => { clearTimeout(repT); clearInterval(repI); document.querySelectorAll('.key.down').forEach(k => k.classList.remove('down')); };
$('kb').addEventListener('pointerdown', e => {
  const b = e.target.closest('.key'); if (!b) return;
  e.preventDefault();
  b.classList.add('down');
  press(b.dataset.k);
  if (b.dataset.k === 'del') repT = setTimeout(() => { repI = setInterval(() => press('del'), 70); }, 420);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => $('kb').addEventListener(ev, stopRep));
$('kb').addEventListener('click', e => { if (e.detail === 0) { const b = e.target.closest('.key'); if (b) press(b.dataset.k); } }); // keyboard activation

document.addEventListener('keydown', e => {
  if (e.target === $('q')) return;
  if (sheetFor) { if (e.key === 'Escape') closeSheet(); return; }
  if (!cur || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  let m = null;
  if (/^\d$/.test(k) || k === '.' || k === '/') m = k;
  else if (k === ',') m = '.';
  else if (k === ' ') m = 'sp';
  else if (k === 'Backspace') m = 'del';
  else if (k === 'Escape' || k === 'Delete') m = 'AC';
  else if (k === '-') m = '±';
  if (m) { e.preventDefault(); press(m); }
});

// iOS-style edge swipe to go back
(() => {
  const d = $('detail'), h = $('home');
  let sw = null;
  d.addEventListener('touchstart', e => {
    if (!cur || sheetFor) return;
    const tt = e.touches[0], r = $('app').getBoundingClientRect();
    if (tt.clientX - r.left > 24) return;
    sw = { x: tt.clientX, y: tt.clientY, dx: 0, on: false, w: r.width };
  }, { passive: true });
  d.addEventListener('touchmove', e => {
    if (!sw) return;
    const tt = e.touches[0], dx = tt.clientX - sw.x, dy = tt.clientY - sw.y;
    if (!sw.on) {
      if (Math.abs(dy) > Math.abs(dx)) { sw = null; return; }
      if (dx > 8) { sw.on = true; d.style.transition = h.style.transition = 'none'; } else return;
    }
    sw.dx = Math.max(0, dx);
    const p = sw.dx / sw.w;
    d.style.transform = `translateX(${sw.dx}px)`;
    h.style.transform = `translateX(${-28 + 28 * p}%)`;
  }, { passive: true });
  const end = () => {
    if (!sw) return;
    const go = sw.on && sw.dx > sw.w * 0.3;
    d.style.transition = h.style.transition = '';
    d.style.transform = h.style.transform = '';
    sw = null;
    if (go) goBack();
  };
  d.addEventListener('touchend', end); d.addEventListener('touchcancel', end);
})();

/* ================= Init ================= */
history.replaceState({ home: 1 }, '');
renderHome();
if (S.view && CAT[S.view]) {
  document.body.classList.add('no-anim');
  openCat(S.view);
  requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove('no-anim')));
}
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
